[package]
name = "protector-win"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow       = { version = "1", features = ["std"] }
axum         = { version = "0.7", features = ["http1", "json", "form", "query", "tokio", "macros"] }
bcrypt       = "0.15"
bytes        = { version = "1", features = ["std"] }
env_logger   = "0.11"
getrandom    = "0.2"
futures-util = { version = "0.3", features = ["alloc", "sink"] }
libc         = "0.2"
log          = "0.4"
regex        = { version = "1", features = ["std", "unicode-case", "unicode-perl"] }
reqwest      = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde        = { version = "1", features = ["derive", "std"] }
serde_json   = "1"
tokio = { version = "1", features = [
    "macros", "rt", "rt-multi-thread",
    "net", "signal", "sync", "io-util", "time",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_Security",
    "Wdk_System_Threading",
] }

[[bin]]
name = "protector-win"
path = "src/main.rs"
